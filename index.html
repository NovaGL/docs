<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #f0f6fc;
      margin-bottom: 0.75rem;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.6rem 1.4rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }

    .btn-primary {
      background: #238636;
      color: #fff;
      border: 1px solid #2ea043;
    }

    .btn-primary:hover {
      background: #2ea043;
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: #484f58;
    }

    footer a {
      color: #58a6ff;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">

    <h1>Docs</h1>
    <p>Public documentation for the <strong>NovaGL/docs</strong> repository. Browse the source or contribute on GitHub.</p>

    <a class="btn btn-primary" href="https://github.com/NovaGL/docs">View on GitHub</a>
  </div>

  <footer>
    Built with <a href="https://pages.github.com/">GitHub Pages</a> &mdash;
    <a href="https://github.com/NovaGL/docs">NovaGL/docs</a>

</html>
